kind = "web"
previewPath = "/"
title = "Jewellery Store"
description = "A refined ecommerce storefront for discovering and shopping distinctive jewellery collections, with product browsing, details, favorites, and a working shopping bag experience."
version = "1.0.0"
id = "artifacts/jewellery-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23307

[services.development]
run = "pnpm --filter @workspace/jewellery-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jewellery-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/jewellery-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23307"
BASE_PATH = "/"
